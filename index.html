<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PanicBoard: quadro de demandas dos seus projetos</title>
<meta name="description" content="Painel pessoal que junta as demandas de vários projetos num quadro só, avisa prazos e atrasos com GIFs de séries e guarda ideias à parte.">
<meta property="og:title" content="PanicBoard">
<meta property="og:description" content="Demandas dos seus projetos num quadro só, com reações de séries quando o prazo aperta.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ececE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<!-- canonical: entra quando houver domínio próprio -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<!-- aplica o tema antes do primeiro desenho, para a tela não piscar; a chave é a mesma de preferencia ('panicboard.ui.tema') -->
<script>(function(){var t=null;try{t=localStorage.getItem('panicboard.ui.tema')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var r=document.documentElement;r.dataset.temaEscolha=t;r.dataset.theme=t})();document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
