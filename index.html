<script>(function(){var t=null;try{t=localStorage.getItem('panicboard.ui.tema')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var r=document.documentElement;r.dataset.temaEscolha=t;r.dataset.theme=t})();document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
